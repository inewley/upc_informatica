<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierto o falso</title>
<style>
  :root {
    color-scheme: light;
    font-family: system-ui, sans-serif;
    color: #182840;
    background: #eaf2f8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 48px);
    background: radial-gradient(ellipse at top left, #d8edf8, transparent 68%);
  }
  main {
    width: min(100%, 760px);
    padding: clamp(22px, 6vw, 56px);
    border: 1px solid #c9dce9;
    border-top: 7px solid #146489;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 24px 65px #18364e17;
  }
  header p {
    margin: 0 0 6px;
    color: #305773;
    font-weight: 650;
  }
  h1 {
    margin: 0 0 24px;
    font-size: clamp(2rem, 7vw, 3.7rem);
    line-height: 1.05;
    letter-spacing: -.045em;
  }
  h2 { font-size: clamp(1.35rem, 4.6vw, 2rem); line-height: 1.3; }
  p { font-size: 1.1rem; line-height: 1.5; }
  button {
    border: 2px solid transparent;
    border-radius: 12px;
    background: #146489;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 750;
    padding: 12px 20px;
    min-height: 52px;
  }
  button:hover:enabled { filter: brightness(.9); }
  :focus-visible { outline: 3px solid #182840; outline-offset: 4px; }
  .answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .answers button { background: #edf6fa; color: #20425b; border-color: #b6d5e4; }
  .answers button:disabled { cursor: default; }
  .answers .correct { background: #def1e7; color: #14583c; border-color: #287453; }
  .answers .incorrect { background: #fbe9e5; color: #8b2820; border-color: #a63a32; }
  .step { margin: 0 0 4px; font-size: .95rem; font-weight: 700; color: #36526b; }
  progress { width: 100%; height: 10px; accent-color: #146489; }
  #feedback { font-weight: 700; }
  #feedback:empty { margin: 0; }
  #next { margin-top: 6px; }
#final-score {
  font-size: clamp(1.7rem, 6vw, 3rem);
  line-height: 1.15;
  margin: .5em 0;
}
:root { --night: #102644; --ink: #1e5480; --accent: #70d8ed; --paper: #e9f8ff; --glow: #70d8ed44; --pad: clamp(22px, 6vw, 56px); }

body {
  background: radial-gradient(ellipse at 78% 5%, var(--glow), transparent 52%),
    linear-gradient(145deg, var(--night), var(--ink));
}
main {
  border: 1px solid var(--accent);
  border-radius: clamp(16px, 4vw, 36px);
  overflow: hidden;
  box-shadow: 0 24px 80px #0005;
}
main > header {
  margin: calc(-1 * var(--pad)) calc(-1 * var(--pad)) 26px;
  padding: var(--pad);
  color: white;
  background: radial-gradient(circle at 100% 0%, var(--glow), transparent 62%),
    repeating-linear-gradient(135deg, transparent 0 16px, #ffffff0b 16px 17px),
    var(--night);
}
main > header p { color: var(--accent); }
main > header h1 { margin-bottom: 0; }
#score { color: var(--night); font-weight: 750; margin: 5px 0 8px; }
#end {
  text-align: center;
  padding: clamp(20px, 5vw, 42px) 12px;
  border-radius: 19px;
  background: var(--paper);
}
#final-score { color: var(--night); margin-top: 0; }
#replay { margin-top: 12px; }
.confetti {
  position: fixed;
  inset: 0;
  z-index: 10;
  overflow: hidden;
  pointer-events: none;
  animation: confetti-fade 5s linear forwards;
}
.confetti i {
  position: absolute;
  top: -20px;
  left: var(--x);
  width: var(--size);
  height: calc(var(--size) * .64);
  background: var(--color);
  animation: confetti-fall var(--duration) var(--delay) linear both;
}
.confetti i:nth-child(3n) { border-radius: 50%; }
@keyframes confetti-fall {
  from { transform: translate3d(0,0,0) rotate(0); }
  to { transform: translate3d(var(--drift),calc(100vh + 30px),0) rotate(var(--spin)); }
}
@keyframes confetti-fade {
  0%, 78% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}
#next:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <p>Trámites por Internet</p>
    <h1>Cierto o falso</h1>
  </header>
  <section id="intro">
    <p>Indica si las siguientes afirmaciones son ciertas o falsas.</p>
    <button id="start" type="button">¡Juega!</button>
  </section>
  <section id="quiz" hidden>
    <p class="step" id="step"></p>
    <p id="score" aria-live="polite"></p><progress id="progress" aria-label="Preguntas respondidas"></progress>
    <h2 id="question" tabindex="-1" aria-describedby="step"></h2>
    <div class="answers">
      <button id="true" type="button">Cierto</button>
      <button id="false" type="button">Falso</button>
    </div>
    <p id="feedback" role="status"></p>
    <button id="next" type="button" aria-describedby="feedback" disabled>Siguiente pregunta</button>
  </section>
  <section id="end" hidden>
    <h2 id="final-score" tabindex="-1"></h2>
    <p>Has terminado todas las preguntas.</p>

    <button id="replay" type="button">Volver a jugar</button>
  </section>
</main>
<script>
  const questions = [
  [
    "En una página segura, nos encontraremos el icono de un candado cerrado al lado de la dirección URL del navegador.",
    true
  ],
  [
    "Nunca debemos introducir datos bancarios o muy personales en ordenadores desconocidos.",
    true
  ],
  [
    "No hace falta que actualicemos el antivirus. Una vez instalado ya sirve para siempre.",
    false
  ],
  [
    "No existe el correo basura. Todo lo que recibimos es información útil.",
    false
  ],
  [
    "Debemos siempre estar al caso de las instrucciones aunque ya hayamos realizado el trámite antes.",
    true
  ],
  [
    "Deberemos estar atentos con las búsquedas en Google para no confundir los resultados con anuncios.",
    true
  ],
  [
    "Siempre abriremos los mensajes que nos llamen la atención (ofertas, regalos, invitaciones,…) aunque provengan de un remitente desconocido.",
    false
  ],
  [
    "Con los trámites en línea nos ahorramos tener que desplazarnos físicamente.",
    true
  ],
  [
    "Al abandonar el ordenador, no hace falta que previamente cerremos nuestra sesión en Gmail, cuenta del banco, etc.",
    false
  ],
  [
    "No se puede responder el mensaje de una persona si no tenemos guardado su correo.",
    false
  ],
  [
    "Conviene guardar/imprimir los comprobantes de nuestros trámites.",
    true
  ],
  [
    "Podemos adjuntar un documento (fotos, archivos, vídeos,…) en un correo electrónico.",
    true
  ],
  [
    "No podemos acceder a Gmail si no tenemos una cuenta de Google.",
    true
  ],
  [
    "Si eliminamos un mensaje no podemos recuperarlo.",
    false
  ],
  [
    "Podemos marcar un mensaje como no deseado para evitar correo basura.",
    true
  ],
  [
    "No podemos consultar mensajes que ya hayamos enviado.",
    false
  ],
  [
    "Gmail tiene la opción de sincronizar el teléfono con el ordenador.",
    true
  ]
];

  const intro = document.getElementById('intro');
  const quiz = document.getElementById('quiz');
  const end = document.getElementById('end');
  const step = document.getElementById('step');
  const progress = document.getElementById('progress');
  const question = document.getElementById('question');
  const trueButton = document.getElementById('true');
  const falseButton = document.getElementById('false');
  const feedback = document.getElementById('feedback');
  const next = document.getElementById('next');

  let round = [];
  let index = 0;

  let points = 0;
  let advanceTimer;
  let confettiLayer;

  function showScore() {
    document.getElementById('score').textContent = `Puntos: ${points} / ${round.length}`;
  }

  function start() {
    clearTimeout(advanceTimer);
    confettiLayer?.remove();
    points = 0;
    round = [...questions];
    for (let position = round.length - 1; position > 0; position--) {
      const other = Math.floor(Math.random() * (position + 1));
      [round[position], round[other]] = [round[other], round[position]];
    }
    index = 0;
    progress.max = round.length;
    showScore();
    intro.hidden = true;
    end.hidden = true;
    quiz.hidden = false;
    showQuestion();
  }

  function showQuestion() {
    step.textContent = `Pregunta ${index + 1} de ${round.length}`;
    progress.value = index;
    question.textContent = round[index][0];
    for (const button of [trueButton, falseButton]) {
      button.disabled = false;
      button.className = '';
    }
    next.disabled = true;
    next.textContent = index + 1 === round.length ? 'Terminar' : 'Siguiente pregunta';
    feedback.textContent = '';
    question.focus();
  }

  function answer(chosen) {
    if (trueButton.disabled) return;
    const expected = round[index][1];
    const correctButton = expected ? trueButton : falseButton;
    const pickedButton = chosen ? trueButton : falseButton;
    correctButton.classList.add('correct');
    if (chosen !== expected) pickedButton.classList.add('incorrect');
    trueButton.disabled = true;
    falseButton.disabled = true;
    progress.value = index + 1;
    feedback.textContent = chosen === expected
      ? '¡Correcto!'
      : `¡Incorrecto! La respuesta es «${correctButton.textContent}».`;
    next.disabled = false;
    if (chosen !== expected) {
      advanceTimer = setTimeout(advance, 2000);
      return;
    }
    points++;
    showScore();

    next.focus();
  }

  document.getElementById('start').addEventListener('click', start);
  document.getElementById('replay').addEventListener('click', start);
  trueButton.addEventListener('click', () => answer(true));
  falseButton.addEventListener('click', () => answer(false));
  function advance() {
    if (next.disabled) return;
    clearTimeout(advanceTimer);
    index++;
    if (index === round.length) {
      quiz.hidden = true;
      end.hidden = false;
      document.getElementById('final-score').textContent = `Puntuación final: ${points} de ${round.length} puntos.`;
      document.getElementById('final-score').focus();
      celebrate();
      return;
    }
    showQuestion();
  }
  next.addEventListener('click', advance);

function celebrate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = document.createElement('div');
  confettiLayer = layer;
  layer.className = 'confetti';
  layer.setAttribute('aria-hidden', 'true');
  const colors = ['#ff6685', '#ffd35c', '#52dbb2', '#57caff', '#ad82ff', '#fff7db'];
  for (let i = 0; i < 72; i++) {
    const piece = document.createElement('i');
    piece.style.setProperty('--x', `${Math.random() * 100}%`);
    piece.style.setProperty('--size', `${6 + Math.random() * 8}px`);
    piece.style.setProperty('--color', colors[i % colors.length]);
    piece.style.setProperty('--duration', `${2.7 + Math.random() * 1.4}s`);
    piece.style.setProperty('--delay', `${Math.random() * .8}s`);
    piece.style.setProperty('--drift', `${Math.random() * 200 - 100}px`);
    piece.style.setProperty('--spin', `${Math.random() * 1440 - 720}deg`);
    layer.append(piece);
  }
  layer.addEventListener('animationend', event => {
    if (event.target === layer) layer.remove();
  });
  document.getElementById('end').append(layer);
}
</script>
</body>
</html>
